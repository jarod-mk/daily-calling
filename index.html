  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(245, 240, 228, 0.83);
    backdrop-filter: blur(1px);
    z-index: 0;
    pointer-events: none;
  }

  /* ── 레이아웃 컨테이너 ── */
  .container {
    max-width: 760px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ── 헤더 ── */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
    animation: fadeDown .5s ease both;
  }
  .header-left h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--text);
    line-height: 1;
  }
  .header-left h1 span {
    color: var(--work);
  }
  .header-date {
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    font-weight: 600;
    color: #1d4ed8;
    margin-top: 7px;
    letter-spacing: .01em;
  }
  .header-summary {
    text-align: right;
  }
  .summary-count {
    font-family: 'DM Mono', monospace;
    font-size: .8rem;
    color: var(--text-muted);
  }
  .summary-pct {
    font-family: 'DM Mono', monospace;
    font-size: 1.6rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
  }
  .summary-pct.done { color: var(--success); }

  /* ── 진행률 바 ── */
  .progress-wrap {
    background: var(--surface2);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 28px;
    overflow: hidden;
    animation: fadeDown .5s .1s ease both;
  }
  .progress-bar {
    height: 100%;
    border-radius: 99px;
    background: var(--work);
    width: 0%;
    transition: width .4s cubic-bezier(.4,0,.2,1), background .4s;
  }

  /* ── 카테고리 탭 ── */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    animation: fadeDown .5s .15s ease both;
    flex-wrap: wrap;
  }
  .tab {
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .8rem;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }
  .tab:hover { border-color: var(--work); color: var(--text); }
  .tab.active { background: var(--work); border-color: var(--work); color: #fff; }
  .tab[data-cat="공부"].active  { background: var(--study);    border-color: var(--study); }
  .tab[data-cat="개인"].active  { background: var(--personal); border-color: var(--personal); }

  /* ── 입력 영역 ── */
  .input-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    animation: fadeDown .5s .2s ease both;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .input-title-wrap {
    position: relative;
    flex: 1;
  }
  #input-title {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 48px 9px 12px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .88rem;
    outline: none;
    transition: border-color var(--transition);
  }
  #input-title:focus { border-color: var(--work); }
  #input-title::placeholder { color: var(--text-dim); }
  .char-counter {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'DM Mono', monospace;
    font-size: .68rem;
    color: var(--text-dim);
    pointer-events: none;
  }
  .char-counter.warn { color: var(--danger); }
  #input-cat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 10px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .82rem;
    outline: none;
    cursor: pointer;
    transition: border-color var(--transition);
  }
  #input-cat:focus { border-color: var(--work); }
  .btn-add {
    padding: 9px 18px;
    background: var(--work);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .85rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }
  .btn-add:hover { background: #1d4ed8; transform: translateY(-1px); }
  .btn-add:active { transform: translateY(0); }

  /* ── 할일 목록 ── */
  .task-list-wrap {
    animation: fadeDown .5s .25s ease both;
  }
  #task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── 할일 아이템 ── */
  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    transition: border-color var(--transition), transform var(--transition);
    animation: slideIn .22s ease both;
    overflow: hidden;
  }
  .task-item:hover { border-color: #c5cfe0; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(30,40,80,.1); }
  .task-item.done { opacity: .5; }
  .task-item.done .task-title { text-decoration: line-through; color: var(--done-text); }

  /* 상단 행 */
  .task-top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  /* 감사와 배울 점 인라인 칸 */
  .note-inline {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    width: 220px;
  }
  .note-label-inline {
    font-size: .7rem;
    font-weight: 700;
    color: #7c3aed;
    white-space: nowrap;
    letter-spacing: .02em;
  }
  .note-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 9px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .8rem;
    line-height: 1.4;
    resize: none;
    outline: none;
    height: 34px;
    overflow: hidden;
    transition: border-color var(--transition), background var(--transition), height var(--transition);
  }
  .note-input:focus { border-color: #7c3aed; background: #fff; height: 58px; }
  .note-input::placeholder { color: var(--text-dim); font-size: .77rem; }
  .task-item.done .note-input { color: var(--text-muted); }
  @media (max-width: 600px) {
    .task-item { flex-wrap: wrap; }
    .note-inline { width: 100%; }
  }

  /* 체크박스 */
  .task-check {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    border: 2px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
  }
  .task-check:checked {
    background: var(--success);
    border-color: var(--success);
  }
  .task-check:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 1px;
    width: 8px; height: 5px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg);
  }

  /* 뱃지 */
  .badge {
    font-size: .68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    white-space: nowrap;
    letter-spacing: .03em;
  }
  .badge-work     { background: var(--work-bg);     color: var(--work); }
  .badge-study    { background: var(--study-bg);    color: var(--study); }
  .badge-personal { background: var(--personal-bg); color: var(--personal); }

  /* 제목 */
  .task-title {
    flex: 1;
    font-size: .9rem;
    line-height: 1.4;
    color: var(--text);
    word-break: break-word;
  }

  /* 액션 버튼 */
  .task-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity var(--transition);
  }
  .task-item:hover .task-actions { opacity: 1; }
  .btn-icon {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    font-size: .8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }
  .btn-icon:hover { border-color: var(--work); color: var(--work); }
  .btn-icon.del:hover { border-color: var(--danger); color: var(--danger); }

  /* ── 인라인 편집 ── */
  .edit-row {
    display: flex;
    gap: 7px;
    align-items: center;
    flex: 1;
    flex-wrap: wrap;
  }
  .edit-title-input {
    flex: 1;
    min-width: 120px;
    background: var(--surface2);
    border: 1px solid var(--work);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .88rem;
    outline: none;
  }
  .edit-cat-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .82rem;
    outline: none;
    cursor: pointer;
  }
  .btn-save {
    padding: 5px 12px;
    background: var(--work);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .8rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-cancel-edit {
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: .8rem;
    cursor: pointer;
  }

  /* ── 빈 상태 ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
  .empty-state p { font-size: .9rem; line-height: 1.6; }
  .empty-state small { font-size: .78rem; color: var(--text-dim); margin-top: 6px; display: block; }

  /* ── 완료 배너 ── */
  .all-done-banner {
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, rgba(5,150,105,.07), rgba(37,99,235,.07));
    border: 1px solid rgba(5,150,105,.2);
    border-radius: var(--radius);
    margin-bottom: 12px;
    font-size: .9rem;
    color: var(--success);
    animation: fadeDown .3s ease;
  }

  /* ── 애니메이션 ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    40%      { transform: translateX(6px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }
  .shake { animation: shake .35s ease; }

  /* ── 반응형 ── */
  @media (max-width: 480px) {
    body { padding: 16px 12px 60px; }
    .header-left h1 { font-size: 1.4rem; }
    .summary-pct { font-size: 1.3rem; }
    .input-row { flex-wrap: wrap; }
    #input-title { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- 헤더 -->
  <header class="header">
    <div class="header-left">
      <h1>Daily Calling<span>.</span></h1>
      <div class="header-date" id="header-date"></div>
    </div>
    <div class="header-summary">
      <div class="summary-pct" id="summary-pct">0%</div>
      <div class="summary-count" id="summary-count">완료 0 / 전체 0</div>
    </div>
  </header>

  <!-- 진행률 바 -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <!-- 카테고리 탭 -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="전체">전체</button>
    <button class="tab" data-cat="업무">업무</button>
    <button class="tab" data-cat="공부">공부</button>
    <button class="tab" data-cat="개인">개인</button>
  </div>

  <!-- 입력 영역 -->
  <div class="input-area">
    <div class="input-row">
      <div class="input-title-wrap">
        <input id="input-title" type="text" placeholder="할 일을 입력하세요..." maxlength="100" autocomplete="off">
        <span class="char-counter" id="char-counter">0/100</span>
      </div>
      <select id="input-cat">
        <option value="업무">업무</option>
        <option value="공부">공부</option>
        <option value="개인">개인</option>
      </select>
      <button class="btn-add" id="btn-add">추가</button>
    </div>
  </div>

  <!-- 할일 목록 -->
  <div class="task-list-wrap">
    <ul id="task-list"></ul>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
//  상태
// ═══════════════════════════════════════════
let tasks = [];
let activeCategory = '전체';
let editingId = null;

// ═══════════════════════════════════════════
//  localStorage CRUD
// ═══════════════════════════════════════════
function loadTasks() {
  try {
    const raw = localStorage.getItem('tasks');
    tasks = raw ? JSON.parse(raw) : [];
  } catch {
    tasks = [];
  }
}

function saveTasks() {
  try {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  } catch {
    alert('저장 공간이 부족합니다. 완료된 항목을 정리해주세요.');
  }
}

function addTask(title, category) {
  title = title.trim();
  if (!title) {
    shakeInput();
    return;
  }
  const task = {
    id: crypto.randomUUID(),
    title,
    category,
    completed: false,
    good: '',
    learn: '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };
  tasks.unshift(task);
  saveTasks();
  renderTasks();
}

function deleteTask(id) {
  if (!confirm('정말 삭제할까요?')) return;
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) {
    el.style.transition = 'opacity .15s, transform .15s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(12px)';
    setTimeout(() => {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }, 160);
  }
}

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.completed = !t.completed;
  t.updatedAt = new Date().toISOString();
  saveTasks();
  renderTasks();
}

function saveEdit(id, newTitle, newCat) {
  newTitle = newTitle.trim();
  if (!newTitle) return;
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.title    = newTitle;
  t.category = newCat;
  t.updatedAt = new Date().toISOString();
  editingId = null;
  saveTasks();
  renderTasks();
}

// ═══════════════════════════════════════════
//  렌더링
// ═══════════════════════════════════════════
function catBadgeClass(cat) {
  return cat === '업무' ? 'badge-work' : cat === '공부' ? 'badge-study' : 'badge-personal';
}

function renderTasks() {
  const list = document.getElementById('task-list');

  // 필터
  let filtered = activeCategory === '전체'
    ? [...tasks]
    : tasks.filter(t => t.category === activeCategory);

  // 정렬: 미완료 먼저
  filtered.sort((a, b) => {
    if (a.completed !== b.completed) return a.completed ? 1 : -1;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  // 탭 카운트 업데이트
  ['업무','공부','개인'].forEach(cat => {
    const btn = document.querySelector(`.tab[data-cat="${cat}"]`);
    const cnt = tasks.filter(t => t.category === cat && !t.completed).length;
    btn.textContent = cnt > 0 ? `${cat} ${cnt}` : cat;
  });

  // 전체 모두 완료 배너
  const banner = document.getElementById('all-done-banner');
  if (banner) banner.remove();

  if (tasks.length > 0 && tasks.every(t => t.completed)) {
    const b = document.createElement('div');
    b.id = 'all-done-banner';
    b.className = 'all-done-banner';
    b.textContent = '🎉 오늘 할 일을 모두 완료했습니다!';
    list.parentNode.insertBefore(b, list);
  }

  // 빈 상태
  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="emoji">${tasks.length === 0 ? '✍️' : '🎯'}</div>
        <p>${tasks.length === 0 ? '오늘의 할 일을 추가해보세요' : '이 카테고리에 할 일이 없습니다'}</p>
        ${tasks.length === 0 ? '<small>위 입력창에서 바로 추가할 수 있어요</small>' : ''}
      </div>`;
    updateProgress();
    return;
  }

  list.innerHTML = '';
  filtered.forEach(t => {
    const li = document.createElement('li');
    li.className = `task-item${t.completed ? ' done' : ''}`;
    li.dataset.id = t.id;

    if (editingId === t.id) {
      // 편집 모드
      li.innerHTML = `
        <div class="task-top">
          <input type="checkbox" class="task-check" ${t.completed ? 'checked' : ''}>
          <div class="edit-row">
            <input class="edit-title-input" value="${escHtml(t.title)}" maxlength="100">
            <select class="edit-cat-select">
              <option ${t.category==='업무'?'selected':''}>업무</option>
              <option ${t.category==='공부'?'selected':''}>공부</option>
              <option ${t.category==='개인'?'selected':''}>개인</option>
            </select>
            <button class="btn-save">저장</button>
            <button class="btn-cancel-edit">취소</button>
          </div>
        </div>
        <div class="note-inline">
          <span class="note-label-inline">🙏 감사·배울점</span>
          <textarea class="note-input note-main" placeholder="감사와 배울 점...">${escHtml(t.good || '')}</textarea>
        </div>`;
      const inp = li.querySelector('.edit-title-input');
      const sel = li.querySelector('.edit-cat-select');
      li.querySelector('.task-check').addEventListener('change', () => toggleTask(t.id));
      li.querySelector('.btn-save').addEventListener('click', () => saveEdit(t.id, inp.value, sel.value));
      li.querySelector('.btn-cancel-edit').addEventListener('click', () => { editingId = null; renderTasks(); });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') saveEdit(t.id, inp.value, sel.value);
        if (e.key === 'Escape') { editingId = null; renderTasks(); }
      });

      // 편집 모드 노트 실시간 저장
      const noteEl2 = li.querySelector('.note-main');
      let dt;
      const sn = () => { clearTimeout(dt); dt = setTimeout(() => {
        const task = tasks.find(x => x.id === t.id);
        if (!task) return;
        task.good = noteEl2.value;
        saveTasks();
      }, 400); };
      noteEl2.addEventListener('input', sn);

      setTimeout(() => { inp.focus(); inp.select(); }, 0);
    } else {
      // 일반 모드
      li.innerHTML = `
        <div class="task-top">
          <input type="checkbox" class="task-check" ${t.completed ? 'checked' : ''}>
          <span class="badge ${catBadgeClass(t.category)}">${t.category}</span>
          <span class="task-title">${escHtml(t.title)}</span>
        </div>
        <div class="note-inline">
          <span class="note-label-inline">🙏 감사·배울점</span>
          <textarea class="note-input note-main" placeholder="감사와 배울 점...">${escHtml(t.good || '')}</textarea>
        </div>
        <div class="task-actions">
          <button class="btn-icon edit" title="수정">✏️</button>
          <button class="btn-icon del" title="삭제">🗑</button>
        </div>`;

      li.querySelector('.task-check').addEventListener('change', () => toggleTask(t.id));
      li.querySelector('.btn-icon.edit').addEventListener('click', () => { editingId = t.id; renderTasks(); });
      li.querySelector('.btn-icon.del').addEventListener('click', () => deleteTask(t.id));

      const noteEl = li.querySelector('.note-main');
      let debounceTimer;
      const saveNote = () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          const task = tasks.find(x => x.id === t.id);
          if (!task) return;
          task.good = noteEl.value;
          task.updatedAt = new Date().toISOString();
          saveTasks();
        }, 400);
      };
      noteEl.addEventListener('input', saveNote);
    }

    list.appendChild(li);
  });

  updateProgress();
}

// ═══════════════════════════════════════════
//  진행률
// ═══════════════════════════════════════════
function updateProgress() {
  const total     = tasks.length;
  const completed = tasks.filter(t => t.completed).length;
  const pct       = total === 0 ? 0 : Math.round(completed / total * 100);

  const bar   = document.getElementById('progress-bar');
  const pctEl = document.getElementById('summary-pct');
  const cntEl = document.getElementById('summary-count');

  bar.style.width = pct + '%';
  bar.style.background =
    pct === 100 ? 'var(--success)' :
    pct >= 67   ? 'var(--work)'    :
    pct >= 34   ? 'var(--warn)'    : 'var(--danger)';

  pctEl.textContent = pct + '%';
  pctEl.className   = 'summary-pct' + (pct === 100 ? ' done' : '');
  cntEl.textContent = `완료 ${completed} / 전체 ${total}`;
}

// ═══════════════════════════════════════════
//  헤더 날짜
// ═══════════════════════════════════════════
function renderDate() {
  const d   = new Date();
  const day = ['일','월','화','수','목','금','토'][d.getDay()];
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('header-date').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${day}요일  ${h}:${m}`;
  // 매분 자동 갱신
  clearTimeout(window._dateTimer);
  window._dateTimer = setTimeout(renderDate, (60 - d.getSeconds()) * 1000);
}

// ═══════════════════════════════════════════
//  유틸
// ═══════════════════════════════════════════
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shakeInput() {
  const el = document.getElementById('input-title');
  el.classList.remove('shake');
  void el.offsetWidth; // reflow
  el.classList.add('shake');
  el.focus();
  setTimeout(() => el.classList.remove('shake'), 400);
}

// ═══════════════════════════════════════════
//  이벤트 바인딩
// ═══════════════════════════════════════════
document.getElementById('btn-add').addEventListener('click', () => {
  const title = document.getElementById('input-title').value;
  const cat   = document.getElementById('input-cat').value;
  addTask(title, cat);
  document.getElementById('input-title').value = '';
  document.getElementById('char-counter').textContent = '0/100';
  document.getElementById('char-counter').classList.remove('warn');
  document.getElementById('input-title').focus();
});

document.getElementById('input-title').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-add').click();
});

document.getElementById('input-title').addEventListener('input', e => {
  const len = e.target.value.length;
  const counter = document.getElementById('char-counter');
  counter.textContent = `${len}/100`;
  counter.classList.toggle('warn', len >= 90);
});

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.cat;
  editingId = null;
  renderTasks();
});

// ESC 전역 편집 취소
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && editingId) {
    editingId = null;
    renderTasks();
  }
});

// ═══════════════════════════════════════════
//  초기화
// ═══════════════════════════════════════════
loadTasks();
renderDate();
renderTasks();
</script>
<script>
if ("serviceWorker" in navigator) {
  const swCode = `
self.addEventListener("install", e => {
  e.waitUntil(
    caches.open("daily-calling-v1").then(c =>
      c.addAll(["/"])
    ).catch(() => {})
  );
});
self.addEventListener("fetch", e => {
  e.respondWith(
    caches.match(e.request).then(r => r || fetch(e.request))
  );
});
`;
  const blob = new Blob([swCode], {type: "application/javascript"});
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(() => {});
}
</script>
</body>
